# Frontend SPA edge config for rc-frontend (unprivileged Nginx).
# Purpose: serve the Vite production bundle and same-origin garage API on loopback
# so compose users hitting :3742 do not depend on a host reverse proxy.
server {
    # Non-standard port avoids collisions with common 3000/8080 dev servers
    listen 3742;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compressed delivery for pit-mat telemetry bundles
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1024;

    # Forward garage API to NestJS. Without this, POST /api/* hits try_files,
    # internally redirects to index.html, and nginx returns 405 Method Not Allowed.
    location /api/ {
        proxy_pass http://rc-backend:5742;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback so client-side toolbox drawer routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for fingerprinted Vite build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
