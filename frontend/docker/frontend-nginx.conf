# Frontend SPA edge config for rc-frontend (unprivileged Nginx).
# Purpose: serve the Vite production bundle as an offline-capable single-page app
# behind host loopback only, keeping all public ingress on the host reverse proxy.
server {
    # Non-standard port avoids collisions with common 3000/8080 dev servers
    listen 3742;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compressed delivery for pit-mat telemetry bundles
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback so client-side toolbox drawer routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for fingerprinted Vite build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
